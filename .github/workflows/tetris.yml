name: Generate Tetris Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate Tetris SVG
        uses: tdworowy/github-contribution-grid-tetris@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/tetris-dark.svg?palette=github-dark
            dist/tetris-light.svg

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
